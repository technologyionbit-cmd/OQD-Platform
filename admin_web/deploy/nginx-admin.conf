# /etc/nginx/sites-available/admin.oqdjo.com
# Static Flutter Web build for the Aqd admin panel. The API stays on
# oqdjo.com (/v1); this host only serves files.
#
# Step 1 (before certbot) this file is HTTP only. `certbot --nginx -d admin.oqdjo.com`
# then adds the 443 block and the redirect by itself.

server {
    listen 80;
    listen [::]:80;
    server_name admin.oqdjo.com;

    root /var/www/admin.oqdjo.com;
    index index.html;

    server_tokens off;

    # --- security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    # CanvasKit/WebAssembly needs 'wasm-unsafe-eval' and blob: workers;
    # Flutter styles inline. connect-src lists the API origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://oqdjo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # (HSTS is added by you once HTTPS works: see DEPLOY.md.)

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # --- caching -----------------------------------------------------------
    # The entry points must always be revalidated, otherwise a new release
    # is not picked up. nginx `add_header` in a location replaces the
    # server-level ones, so the security headers are repeated there.
    location = /index.html            { include /etc/nginx/snippets/admin-nocache.conf; }
    location = /flutter_bootstrap.js  { include /etc/nginx/snippets/admin-nocache.conf; }
    location = /flutter_service_worker.js { include /etc/nginx/snippets/admin-nocache.conf; }
    location = /version.json          { include /etc/nginx/snippets/admin-nocache.conf; }
    location = /manifest.json         { include /etc/nginx/snippets/admin-nocache.conf; }

    # (application/wasm is in nginx's stock mime.types; do not redeclare
    # `types` here, it would replace the whole table for this server.)

    # --- SPA fallback ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles or source maps.
    location ~ /\.      { deny all; }
    location ~ \.map$   { deny all; }
}
