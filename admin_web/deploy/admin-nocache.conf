# /etc/nginx/snippets/admin-nocache.conf
# Included by the entry-point locations of admin.oqdjo.com: same security
# headers as the server block (add_header does not inherit once a location
# sets its own) plus "always revalidate".
add_header Cache-Control "no-cache" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Robots-Tag "noindex, nofollow" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://oqdjo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
