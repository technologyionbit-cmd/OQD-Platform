name: aqd_ionbit
description: "Aqd (عقد) - LegalTech platform mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.0.0

  # Networking
  dio: ^5.11.0

  # Typed models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Secure/local storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3

  # Localization
  intl: ^0.20.3

  # Media
  image_picker: ^1.1.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.5

  # Test-only: lets chat_room_screen widget tests fake ImagePicker.pickImage
  # without touching a real gallery/platform channel.
  image_picker_platform_interface: ^2.11.1

flutter:
  uses-material-design: true
  generate: true
