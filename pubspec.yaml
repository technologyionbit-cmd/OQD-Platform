name: aqd_ionbit
description: "Aqd (عقد) - LegalTech platform mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management / DI
  flutter_riverpod: ^3.3.2

  # Routing
  go_router: ^17.0.0

  # Networking
  dio: ^5.11.0

  # Typed models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Secure/local storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3

  # Localization
  intl: ^0.20.3

  # Media
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  local_auth: ^3.0.2
  printing: ^5.15.1
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  mocktail: ^1.0.5

  # Test-only: lets chat_room_screen widget tests fake ImagePicker.pickImage
  # without touching a real gallery/platform channel.
  image_picker_platform_interface: ^2.11.1
  file_picker_platform_interface: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/

  # IBM Plex Sans Arabic (SIL OFL). Only the weights the type scale uses are
  # bundled; Thin/ExtraLight/Light stay in assets/fonts/ unregistered.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
