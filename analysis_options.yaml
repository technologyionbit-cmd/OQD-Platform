# Static analysis for the Aqd app. Run with `flutter analyze`; CI and every
# change must keep it at zero issues.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/localization/generated/**
  # No implicit `dynamic`: every cast is explicit, every generic is typed.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Type safety
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_type_to_string
    - test_types_in_equals

    # Async correctness — a dropped Future hides its errors.
    - unawaited_futures
    - unnecessary_await_in_return
    - use_build_context_synchronously
    - cancel_subscriptions
    - close_sinks
    - throw_in_finally

    # Errors: only Exception/Error subtypes are thrown (Failure implements Exception).
    - only_throw_errors

    # Readability / consistency
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_single_quotes
    - prefer_int_literals
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - avoid_redundant_argument_values
    - use_super_parameters
    - sort_constructors_first
    - no_leading_underscores_for_local_identifiers
